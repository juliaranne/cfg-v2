schema {
    query: Query
}

type Exercise {
    exerciseType: String
    description: String
    totalDuration: Int
}

type Stats {
    username: String
    exercises: [Exercise]
}

type Results {
    results: Stats
    success: Boolean!
    error: String
}

type Query {
    weekly_stats(start: String!, end: String!, username: String!): Results
    stats(username: String!): Results
}