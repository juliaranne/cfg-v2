schema {
    query: Query
}

type Exercise {
    exerciseType: String
    description: String
    totalDuration: Int
}

type WeeklyStats {
    exercises: [Exercise]
}

type Results {
    results: Stats
    success: Boolean
}

type Stats {
    username: String
    exercises: [Exercise]
}

type Query {
    stats_by_week(start: String!, end: String!, username: String!): WeeklyStats
    stats(username: String!): Results
}