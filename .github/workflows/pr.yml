name: Pull Request build and test

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"
          up-flags: "-d"  # This will run docker-compose in detached mode


      - name: Wait for service to be ready
        run: |
            # Example: Wait for a specific port to be open (adjust based on your service)
            until curl --silent --fail http://localhost:80; do
              echo "Waiting for the service to be ready..."
              sleep 5
            done
            echo "Service is ready!"    

  selenium-tests:
    runs-on: ubuntu-latest
    needs: build  # This ensures 'selenium-tests' runs after 'build'

    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Set up WebDriver Manager
        run: |
          # WebDriverManager will handle the chromedriver download and setup in the tests
          echo "WebDriverManager will handle the ChromeDriver setup."

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

#      - name: Set up JDK 11
#        uses: actions/setup-java@v3
#        with:
#          java-version: '21'

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adoptopenjdk'

      - name: Set JAVA_HOME for JDK 21
        run: |
          export JAVA_HOME=$HOME/.sdkman/candidates/java/21-open
          echo "JAVA_HOME is set to $JAVA_HOME"
          export PATH=$JAVA_HOME/bin:$PATH   


      - name: Run Maven build
        run: |
          cd e2e_testing
          mvn clean install

      - name: Run Selenium Tests
        run: |
          cd e2e_testing
          mvn test -e

  teardown:
    runs-on: ubuntu-latest
    needs: selenium-tests  # This ensures 'teardown' runs after 'selenium-tests'

    steps:
      - uses: actions/checkout@v4

      - name: Stop and clean up containers
        run: docker-compose down
