name: Pull Request build and test

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"
          detached: true  # This will keep the services running in the background

      - name: Wait for service to be ready
        run: |
            # Example: Wait for a specific port to be open (adjust based on your service)
            until curl --silent --fail http://localhost:80; do
              echo "Waiting for the service to be ready..."
              sleep 5
            done
            echo "Service is ready!"    

  selenium-tests:
    runs-on: ubuntu-latest
    needs: build  # This ensures 'selenium-tests' runs after 'build'

    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Set up WebDriver Manager
        run: |
          # WebDriverManager will handle the chromedriver download and setup in the tests
          echo "WebDriverManager will handle the ChromeDriver setup."

      - name: Run Selenium Tests
        run: |
          cd e2e_testing
          mvn test -e

  teardown:
    runs-on: ubuntu-latest
    needs: selenium-tests  # This ensures 'teardown' runs after 'selenium-tests'

    steps:
      - uses: actions/checkout@v4

      - name: Stop and clean up containers
        run: docker-compose down
