name: Pull Request build and test

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"
          up-flags: "-d"

      - name: Wait for service to be ready
        run: |
            echo "Checking if service is ready..."
            RETRIES=12  # Wait for up to 60 seconds (12 * 5 seconds)
            URL="http://localhost:80"
            while ! curl --silent --fail --max-time 2 $URL; do
              RETRIES=$((RETRIES-1))
              if [ $RETRIES -le 0 ]; then
                echo "Service did not become ready in time. Exiting..."
                exit 1
              fi
              echo "Waiting for the service to be ready..."
              sleep 5
            done
            echo "Service is ready!"  

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable


      - name: Install xvfb and Chrome
        run: |
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable xvfb
            google-chrome --version

      - name: Start xvfb
        run: |
                export DISPLAY=:99
                Xvfb :99 -screen 0 1920x1080x24 &

      - name: Debug Xvfb
        run: |
                echo "Testing Xvfb..."
                export DISPLAY=:99
                xdpyinfo -display :99 || echo "Xvfb failed to start"

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
            

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set JAVA_HOME for JDK 21
        run: |
          export JAVA_HOME=$HOME/.sdkman/candidates/java/21-open
          echo "JAVA_HOME is set to $JAVA_HOME"
          export PATH=$JAVA_HOME/bin:$PATH
      #      - name: Run Maven build
#        run: |
#          cd e2e_testing
#          mvn clean install

      - name: Run Selenium Tests
        run: |
          cd e2e_testing
          mvn test -e
        env:
          DISPLAY: :99

      - name: Publish Cucumber Report
        uses: deblockt/cucumber-report-annotations-action@v1.7
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          path: "e2e_testing/target/cucumber-reports/cucumber-report.json"