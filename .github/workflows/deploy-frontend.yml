# ––––––––––––––––––––––––––––––––
# Alternative to ECR deployment.
# Ensure DOCKER_USERNAME, DOCKER_PASSWORD and your username to Github secrets
# before attempting to run the pipeline.
# ––––––––––––––––––––––––––––––––

name: Deploy Frontend Service to Docker Hub

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch: # Enables manual trigger


jobs:
  build:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo The PR was merged
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, tag, and push image to Docker Hub (Frontend)
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-fe:latest -t ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-fe:${{ github.sha }} -f Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-fe:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-fe:${{ github.sha }}
