# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––
# GitHub Actions workflow for deploying the Analytics Service 
# to Docker Hub.
#
# Prerequisites:
# - Add DOCKER_USERNAME and DOCKER_PASSWORD to GitHub Secrets.
# - Ensure the workflow is triggered by merging a PR or manually.
# ––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––

name: Deploy Analytics Service to Docker Hub

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - "analytics/**"
      - "analtyics_v2/**"
  workflow_dispatch: # Enables manual trigger for this workflow.


jobs:
  build:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo The PR was merged
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, tag, and push image to Docker Hub (Analytics)
        run: |
          cd analytics
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics:${{ github.sha }} \
                       -f Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics:${{ github.sha }}
        
      - name: Build, tag, and push image to Docker Hub (Analytics)
        run: |
          cd analytics_v2
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics-v2:latest -t ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics-v2:${{ github.sha }} -f Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics-v2:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mla-fitnessapp-analytics-v2:${{ github.sha }}
